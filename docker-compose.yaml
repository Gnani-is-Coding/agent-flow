  #     - mongo-data:/data/db

  redis:
    image: redis:7
    restart: unless-stopped
    container_name: agentflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:17
    restart: unless-stopped
    container_name: agentflow-postgresDB
    ports: 
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: test123
      POSTGRES_DB: mydatabase
    volumes:
     - postgres-data:/var/lib/postgresql/data

volumes: 
  redis-data:
  postgres-data:

